# /etc/nginx/conf.d/trackstat.conf
# trackstat — Steal An Egg pet tracker (VPS: 104.207.92.225)
#   sae.lookstat.ninja  -> backend API  (docker container on 127.0.0.1:3030)
#   danh.lookstat.ninja -> frontend     (docker nginx container on 127.0.0.1:3031)
#
# TLS: Let's Encrypt (one cert covering both domains). Get it FIRST:
#   apt install -y certbot
#   systemctl stop nginx
#   certbot certonly --standalone -d sae.lookstat.ninja -d danh.lookstat.ninja
#   (cert lands in /etc/letsencrypt/live/sae.lookstat.ninja/ — auto-renewed by timer)
#
# Install:  copy to /etc/nginx/conf.d/trackstat.conf
# Test:     nginx -t && systemctl reload nginx

# ---------- backend API (sae.lookstat.ninja) ----------
# http -> https redirect
server {
    listen 80;
    server_name sae.lookstat.ninja;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sae.lookstat.ninja;

    ssl_certificate     /etc/letsencrypt/live/sae.lookstat.ninja/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sae.lookstat.ninja/privkey.pem;

    # client posts pet data every 5s — allow generous bodies (backend limit is 10mb)
    client_max_body_size 10m;

    # CORS — the frontend (danh.lookstat.ninja) calls this API cross-origin.
    # "always" = also send on error responses.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;

    # answer CORS preflight (browsers only; executor HTTP doesn't preflight)
    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- frontend (danh.lookstat.ninja) ----------
# http -> https redirect
server {
    listen 80;
    server_name danh.lookstat.ninja;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name danh.lookstat.ninja;

    # same cert — it covers both domains
    ssl_certificate     /etc/letsencrypt/live/sae.lookstat.ninja/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sae.lookstat.ninja/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
